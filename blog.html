<main class="wrap">
  <div class="section-head">
    <h2>Journal</h2>
    <p class="muted" style="margin:0">Notes on technique, materials and keeping things from tarnishing.</p>
  </div>
  <div class="post-grid" id="posts"></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("posts").innerHTML = POSTS.map(function (p) {
    return '<article class="post-card">' +
      '<p class="post-meta">' + p.category + ' &middot; ' + p.read_minutes + ' min read &middot; ' +
      new Date(p.date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) + '</p>' +
      '<h3><a href="blog-post.html?slug=' + p.slug + '" data-post="' + p.slug + '">' + p.title + '</a></h3>' +
      '<p class="muted">' + p.excerpt + '</p>' +
      '<p style="margin:0"><a href="blog-post.html?slug=' + p.slug + '" data-post="' + p.slug + '">Read the post</a></p>' +
      '</article>';
  }).join("");

  document.getElementById("posts").addEventListener("click", function (e) {
    var link = e.target.closest("[data-post]");
    if (!link) return;
    var post = POSTS.find(function (p) { return p.slug === link.getAttribute("data-post"); });
    dataLayer.push({ event: "select_post", blog_slug: post.slug, blog_title: post.title, blog_category: post.category });
  });
});
</script>
</body>
</html>

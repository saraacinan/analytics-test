<main class="wrap">
  <div style="max-width:520px;margin:0 auto">
    <h1 style="font-family:'Bagel Fat One',cursive">Order placed</h1>
    <p class="muted">Nothing was charged. The order is stored in this browser so you can test returns from your account page.</p>
    <div class="receipt" id="receipt" style="margin-top:1.6rem"></div>
    <div style="display:flex;gap:.6rem;margin-top:1.4rem;flex-wrap:wrap">
      <a class="btn btn-solid" href="account.html#orders">See your orders</a>
      <a class="btn btn-ghost" href="category.html">Keep shopping</a>
    </div>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const id = new URLSearchParams(location.search).get("order");
  const order = getOrders().find(o => o.transaction_id === id);
  const host = document.getElementById("receipt");

  if (!order) {
    host.innerHTML = "<p>That order is not in this browser.</p>";
    return;
  }

  host.innerHTML = `
    <h2>Receipt</h2>
    <div class="receipt-line"><span>Order</span><span>${order.transaction_id}</span></div>
    <div class="receipt-line"><span>Placed</span><span>${new Date(order.placed_at).toLocaleDateString("en-GB")}</span></div>
    <div class="receipt-line"><span>Delivery</span><span>${order.shipping_tier}</span></div>
    <div class="receipt-line"><span>Payment</span><span>${order.payment_type}</span></div>
    <div class="receipt-rule"></div>
    ${order.items.map(i => `<div class="receipt-line"><span>${i.quantity} &times; ${i.item_name}</span><span>${money(i.price * i.quantity)}</span></div>`).join("")}
    <div class="receipt-rule"></div>
    ${order.coupon ? `<div class="receipt-line"><span>Coupon</span><span>${order.coupon}</span></div>` : ""}
    <div class="receipt-line"><span>Shipping</span><span>${money(order.shipping)}</span></div>
    <div class="receipt-line"><span>Tax</span><span>${money(order.tax)}</span></div>
    <div class="receipt-line receipt-total"><span>Total</span><span>${money(order.value)}</span></div>`;
});
</script>
</body>
</html>
